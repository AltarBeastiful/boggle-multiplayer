<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Installable, so the round can be announced on the icon in the dock. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Boggle multijoueur en temps réel : créez une salle, partagez le lien, jouez à plusieurs."
    />
    <title>Boggle multijoueur</title>
    <script>
      // Before the first paint, otherwise the page flashes light then turns dark.
      (function () {
        try {
          var stored = localStorage.getItem('boggle.theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#020617' : '#eef2f7');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
