<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A die at rest. The tab strip has a theme of its own, and the die follows it
    the way the grid follows the page: dark letters on a pale face when the
    browser is light, the other way round when it is dark. Either way it is
    read against the strip rather than lost in it.
  -->
  <style>
    .die { fill: #0f172a }
    .letter { fill: #fffbeb }
    @media (prefers-color-scheme: dark) {
      .die { fill: #fffbeb }
      .letter { fill: #0f172a }
    }
  </style>
  <rect class="die" width="32" height="32" rx="7" />
  <text
    class="letter"
    x="16"
    y="24"
    text-anchor="middle"
    font-size="22"
    font-weight="700"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  >B</text>
</svg>
