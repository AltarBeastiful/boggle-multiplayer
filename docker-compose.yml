# Pile autonome : Traefik en façade (80/443, certificat Let's Encrypt) et le jeu
# derrière. Elle ne dépend d'aucun autre conteneur.
#
#   cp .env.example .env              puis renseigner BOGGLE_HOST
#   docker compose up -d --build      démarrer / mettre à jour
#   docker compose logs -f traefik    suivre l'obtention du certificat
#   docker compose down               arrêter
#
# BOGGLE_HOST doit pointer (DNS) vers ce serveur : Let's Encrypt vérifie le
# domaine en se connectant au port 443. Sans nom de domaine, sslip.io et nip.io
# résolvent n'importe quelle adresse IP sans inscription (voir .env.example).

services:
  traefik:
    image: traefik:v3.3
    container_name: boggle-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --providers.docker=true
      # Rien n'est exposé sans label explicite.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Tout le trafic en clair est renvoyé vers HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # TLS-ALPN-01 : la validation passe par le 443, déjà ouvert. Pas besoin
      # d'exposer quoi que ce soit d'autre.
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Les certificats survivent aux redémarrages : Let's Encrypt limite le
      # nombre d'émissions par semaine, il ne faut pas les redemander à chaque fois.
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  boggle:
    build:
      context: .
      args:
        # `off` supprime le tracé du mot trouvé sur la grille.
        VITE_WORD_TRACE: ${VITE_WORD_TRACE:-on}
    image: boggle-multiplayer:latest
    container_name: boggle
    restart: unless-stopped
    depends_on:
      - traefik

    environment:
      NODE_ENV: production
      PORT: 3001

    # Publié sur la boucle locale seulement : l'accès public passe par Traefik.
    # Permet de diagnostiquer depuis le serveur (curl 127.0.0.1:3001/api/health).
    ports:
      - '127.0.0.1:${BOGGLE_PORT:-3001}:3001'

    # Mots ajoutés / exclus modifiables sans reconstruire l'image.
    volumes:
      - ./server/data:/app/server/data:ro

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.boggle.rule=Host(`${BOGGLE_HOST}`)'
      - 'traefik.http.routers.boggle.entrypoints=websecure'
      - 'traefik.http.routers.boggle.tls=true'
      - 'traefik.http.routers.boggle.tls.certresolver=le'
      - 'traefik.http.services.boggle.loadbalancer.server.port=3001'
