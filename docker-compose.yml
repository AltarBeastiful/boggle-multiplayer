# Self-contained stack: Traefik in front on 80 and 443 with a Let's Encrypt
# certificate, the game behind it. It depends on no other container.
#
#   cp .env.example .env              then fill in BOGGLE_HOST
#   docker compose up -d --build      start or update
#   docker compose logs -f traefik    follow the certificate issuance
#   docker compose down               stop
#
# BOGGLE_HOST must resolve to this server: Let's Encrypt checks the domain by
# connecting to port 443. Without a domain name, sslip.io and nip.io resolve any
# IP address with no registration, see .env.example.

services:
  traefik:
    image: traefik:v3.3
    container_name: boggle-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --providers.docker=true
      # Nothing is exposed without an explicit label.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # All plaintext traffic is redirected to HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # TLS-ALPN-01: validation goes through 443, which is already open. Nothing
      # else needs exposing.
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Certificates survive restarts. Let's Encrypt caps issuance per week, so
      # they must not be requested again on every start.
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  boggle:
    build:
      context: .
      args:
        # `off` removes the trace of a found word on the grid.
        VITE_WORD_TRACE: ${VITE_WORD_TRACE:-on}
    image: boggle-multiplayer:latest
    container_name: boggle
    restart: unless-stopped
    depends_on:
      - traefik

    environment:
      NODE_ENV: production
      PORT: 3001

    # Published on the loopback only; public access goes through Traefik.
    # Handy to diagnose from the server: curl 127.0.0.1:3001/api/health.
    ports:
      - '127.0.0.1:${BOGGLE_PORT:-3001}:3001'

    # Added and excluded words, editable without rebuilding the image.
    volumes:
      - ./server/data:/app/server/data:ro

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.boggle.rule=Host(`${BOGGLE_HOST}`)'
      - 'traefik.http.routers.boggle.entrypoints=websecure'
      - 'traefik.http.routers.boggle.tls=true'
      - 'traefik.http.routers.boggle.tls.certresolver=le'
      - 'traefik.http.services.boggle.loadbalancer.server.port=3001'
